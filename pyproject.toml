[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-mcp"
version = "0.1.0"
description = "Servidor MCP de consulta de estoque com operações somente de leitura."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
